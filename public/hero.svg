<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#3F5266"/>
      <rect width="7" height="14" fill="#3A4C5E"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="46%" r="74%">
      <stop offset="0%" stop-color="#1A1F26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A1F26" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#hatch)"/>

  <!-- Centred so it survives bg-cover cropping down to mobile widths. -->
  <g fill="none" stroke="#C7A05E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <!-- gavel: banded head, handle, flared grip -->
    <g transform="translate(800 372) rotate(-24)">
      <rect x="-178" y="-74" width="356" height="148" rx="26"/>
      <line x1="-112" y1="-74" x2="-112" y2="74"/>
      <line x1="112" y1="-74" x2="112" y2="74"/>
      <path d="M-26 74 v168"/>
      <path d="M26 74 v168"/>
      <rect x="-40" y="238" width="80" height="86" rx="26"/>
    </g>

    <!-- sound block -->
    <g transform="translate(800 806)">
      <ellipse cx="0" cy="0" rx="196" ry="48"/>
      <path d="M-196 2 v26 q0 26 40 34 h312 q40 -8 40 -34 v-26"/>
      <ellipse cx="0" cy="0" rx="128" ry="30" opacity="0.6"/>
    </g>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
